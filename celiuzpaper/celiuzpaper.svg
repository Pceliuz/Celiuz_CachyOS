<?xml version="1.0" encoding="UTF-8"?>
<!-- Icono de CeliuzPaper.
     Un lienzo 16:9 (la forma de un fondo de pantalla) con el triangulo de
     reproduccion dentro, porque los fondos son video. Los colores son los mismos
     que la barra y el dock: violeta profundo de fondo y amatista #b16cff para lo
     que importa, asi el icono pertenece al mismo sistema que el resto. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1046"/>
      <stop offset="1" stop-color="#120621"/>
    </linearGradient>
    <linearGradient id="marco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3a4ff"/>
      <stop offset="1" stop-color="#8f42e8"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#fondo)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25"
        fill="none" stroke="#b16cff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- El lienzo. -->
  <rect x="12" y="18" width="40" height="22.5" rx="4"
        fill="none" stroke="url(#marco)" stroke-width="2.5"/>
  <path d="M28.5 25.5 L37.5 29.75 L28.5 34 Z" fill="#b16cff"/>

  <!-- La tira de abajo: tres tarjetas, la del medio encendida. Es la app en
       miniatura, y de lejos se lee como un pie de foto. -->
  <rect x="12" y="46" width="10" height="6" rx="2" fill="#b16cff" fill-opacity="0.30"/>
  <rect x="27" y="45" width="10" height="8" rx="2" fill="#b16cff"/>
  <rect x="42" y="46" width="10" height="6" rx="2" fill="#b16cff" fill-opacity="0.30"/>
</svg>
