# kitty/celiuz-transparencia.conf — el fondo de la terminal translucido, para
# que se vea el wallpaper detras (2026-11-02). El texto queda solido.
#
# Lo engancha `instalar.sh` con un `include` marcado AL FINAL del kitty.conf
# del usuario: en kitty gana el ultimo que habla, asi que esto pisa un
# background_opacity que tuvieras antes. Para quitarlo, borra esas lineas.
#
# El desenfoque de detras se quita en lua/windowrules.lua (no_blur): con el
# blur de Hyprland el fondo se volvia lechoso.
#
# 0.35 al principio; 0.40 desde el 2026-11-04 (el usuario la queria un poco
# mas oscura).
background_opacity          0.40

# Para que un `kitty.conf` recargado (ctrl+shift+F5) o
# `kitty @ set-background-opacity` puedan cambiarlo sin reabrir la terminal.
dynamic_background_opacity  yes
