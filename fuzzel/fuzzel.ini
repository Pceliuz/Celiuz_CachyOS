# ~/dotfiles/fuzzel/fuzzel.ini
# Lanzador de aplicaciones. Symlink: ~/.config/fuzzel -> ~/dotfiles/fuzzel
#
# Misma paleta que la barra: fondo violeta profundo, acento amatista. Los
# colores van en RRGGBBAA y SIN almohadilla, que es como los quiere fuzzel.
#
# Se abre con SUPER+D (ver conf/keybinds.conf). Escribe para filtrar, Enter
# lanza, Escape cierra.

font=MesloLGS Nerd Font:size=13
# Lupa antes del cursor. Va entre comillas para que fuzzel respete los
# espacios; el glifo se escribe por codepoint porque estos caracteres del
# Area de Uso Privado se pierden al copiarlos entre editores.
prompt="󰍉  "
# Se usan los iconos del tema del sistema; si un dia no se ven, es que falta un
# tema de iconos instalado (adwaita, papirus...), no un fallo de esta config.
icon-theme=Adwaita
icons-enabled=yes

# Tamano: ancho en caracteres y numero de resultados visibles.
width=45
lines=12
line-height=26
horizontal-pad=24
vertical-pad=18
inner-pad=10

# Coloca la ventana un poco por encima del centro: cae mas natural a la vista
# que el centro exacto.
anchor=center
y-margin=0

# Ordena por uso: lo que mas abres sube solo.
sort-result=yes
match-mode=fzf
show-actions=yes
terminal=kitty -e
layer=overlay

# Cada app lanzada desde aqui va a su PROPIO scope de systemd
# (app.slice/app-graphical.slice/app-*.scope) en vez de caer en el cgroup del
# compositor. Es lo que permite congelar aplicaciones sueltas al bloquear la
# pantalla sin congelar de paso a Hyprland (ver hypr/scripts/lib/congelar.py).
# El dock hace lo mismo desde gen-dock.py.
launch-prefix=uwsm app --

[colors]
# Fondo violeta profundo, algo translucido como las pastillas de la barra.
background=140826f2
text=e0def4ff
# Las letras que coinciden con lo que escribes, en amatista.
match=b16cffff
selection=2a1140ff
selection-text=ffffffff
selection-match=b16cffff
border=b16cffff

[border]
width=1
radius=10

[dmenu]
# Para menus propios (apagado, capturas...) hechos con scripts.
mode=text

[key-bindings]
# Ctrl+J / Ctrl+K para moverse sin sacar las manos de la posicion de escritura.
next=Down Control+j
prev=Up Control+k
cancel=Escape Control+c
