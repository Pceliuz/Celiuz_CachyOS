# theme.conf — lo que se puede cambiar del tema sin tocar QML.
#
# Main.qml lee esto como `config.loQueSea`. Una clave vacia o que no este vuelve
# al valor de fabrica que lleva el propio QML detras, asi que borrar una linea
# nunca rompe nada.
#
# OJO: el tema que ves al arrancar es la COPIA que vive en
# /usr/share/sddm/themes/celiuz. Editar este fichero en el repo no cambia lo que
# sale en el arranque hasta que vuelvas a pasar:
#
#     ./instalar.sh --sddm

[General]

# El titulo, arriba de la columna. 彼岸花 (higanbana) es el del autor; pon el
# tuyo, o tu nombre, o dejalo vacio si no quieres ninguno.
titulo=彼岸花

# Las fuentes. Si no las tienes instaladas, Qt cae a la del sistema y la
# pantalla sigue viendose — solo cambia la letra.
fuente=MesloLGS Nerd Font
fuenteTitulo=Noto Sans CJK TC

# El formato de la fecha bajo el reloj. Los nombres de dia y de mes salen SOLOS
# en el idioma del sistema (el de /etc/locale.conf, que es el que ve el greeter);
# lo unico escrito aqui es el "de" que los une. En un equipo en ingles quedaria
# "Monday · 03 de August", asi que ahi conviene poner algo como:
#     formatoFecha=dddd, MMMM dd
formatoFecha=dddd · dd 'de' MMMM

# Cuanto oscurece el velo que va sobre el fondo, de 0 (nada) a 1 (negro). Sin
# el, un fondo claro se come el texto del reloj.
#
# 0.30 es EXACTAMENTE el del bloqueo (`rgba(0d04184d)` en hyprlock.conf, que es
# $abismo al 30%). Encima va la banda de la columna, que suma su propio 55%
# sobre la parte izquierda. Si lo subes aqui, esta pantalla se vera mas oscura
# que la de bloqueo y la pareja se nota al comparar.
veloOpacidad=0.30

# Con varias cuentas en el equipo, la lista sale sola. Ponlo en true si quieres
# verla tambien cuando solo hay una.
mostrarCuentasSiempre=false
