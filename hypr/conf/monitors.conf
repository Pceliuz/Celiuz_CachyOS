# monitors.conf — resolucion, posicion, escala y tasa de refresco de cada pantalla.
#
# Sintaxis: monitor = nombre, resolucion@refresco, posicion, escala
#
# ESTA LINEA ES DEL EQUIPO DEL AUTOR: HDMI-A-1, TES TE-2412S (~24"), 100Hz. En
# otra maquina no existe ese nombre de salida y la linea no hace nada — no
# molesta, pero tampoco sirve. Pon la tuya: `hyprctl monitors` dice como se llama
# la tuya y que modos admite.
monitor = HDMI-A-1, 1920x1080@100, 0x0, 1

# Fallback por si conectas un monitor no listado arriba (ej. otra PC, proyector).
monitor = , preferred, auto, 1
