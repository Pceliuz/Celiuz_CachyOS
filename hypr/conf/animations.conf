# animations.conf — bezier curves y animaciones de ventanas/workspaces.
# El grueso (ventanas, workspaces, fade) es del paso 5 del plan. Por ahora solo
# esta lo que necesita el auto-ocultado de la barra.

animations {
    enabled = true

    # Curva de salida rapida al principio y frenado largo al final (easeOutQuint).
    # Es lo que hace que el deslizado se sienta fluido y no mecanico.
    bezier = barSlide, 0.22, 1.0, 0.36, 1.0

    # `layers` cubre las superficies de capa: barras, notificaciones, launcher.
    # 4 = 400ms. Ojo: esto NO anima el auto-ocultado de la barra (waybar no
    # destruye su superficie al ocultarse, ver style.css); solo actua al
    # arrancar y cerrar. Queda puesto para el launcher del paso 4.
    animation = layers, 1, 4, barSlide, slide
}
