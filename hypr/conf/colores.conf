# colores.conf — LA PALETA. Un solo tono, muchas alturas.
#
# La idea de la que sale todo esto: una via lactea de un solo color. No se
# trata de repartir violeta por todas partes hasta que grite, sino de que cada
# variante tenga UN trabajo y no invada el del vecino. Si dos tonos hacen lo
# mismo, sobra uno; si un tono no se sabe para que esta, fuera.
#
# La base es el NEGRO, no el violeta. La pantalla parte del vacio, y el violeta
# aparece solo donde hay algo que decir — como una pantalla OLED, donde el
# color resalta porque el negro de al lado es negro de verdad y no gris.
#
# Este archivo se hace `source` EL PRIMERO en hyprland.conf: las variables de
# hyprlang son sustitucion de texto, asi que tienen que existir antes de que
# alguien las use.
#
# Formato: los colores son AARRGGBB dentro de rgba(). Los que llevan alfa < ff
# estan pensados para halos y sombras, donde lo que importa es cuanto dejan ver
# de lo que hay detras.


# ---------------------------------------------------------------------------
# EL VACIO — lo que hay cuando no hay nada
# ---------------------------------------------------------------------------

# Negro absoluto. Es el lienzo, y es lo que hace que todo lo de abajo brille.
# En cuanto esto se vuelve gris (el ff111111 que trae Hyprland de fabrica), el
# amatista deja de ser neon y pasa a ser un violeta cualquiera.
$negro          = rgba(000000ff)

# Negro con una gota de violeta dentro. No se lee como color, se lee como
# profundidad: es el negro que sabe de que familia es.
$abismo         = rgba(0d0418ff)


# ---------------------------------------------------------------------------
# LAS SUPERFICIES — lo que sostiene, nunca lo que llama la atencion
# ---------------------------------------------------------------------------

# El violeta profundo que ya usan las pastillas de la barra y la tarjeta del
# bloqueo. Es el suelo sobre el que se apoya el texto.
$superficie     = rgba(1a0830ff)

# Lo que existe pero no reclama nada: el borde de la ventana que no estas
# usando. Tiene que verse SOLO lo justo para saber donde acaba una ventana. Si
# se aclara mas, empieza a competir con la ventana activa y se pierde de un
# vistazo cual tiene el foco.
$apagado        = rgba(2d1b4eff)


# ---------------------------------------------------------------------------
# LA LUZ — de mas grave a mas aguda. Este es el degradado.
# ---------------------------------------------------------------------------
# Los tres se usan JUNTOS y en este orden. Por separado son solo violetas; lo
# que hace el efecto neon es el recorrido del grave al agudo, igual que un tubo
# de neon tiene el color saturado en los bordes y el nucleo casi blanco.

# El grave. Violeta puro y muy saturado, casi indigo. Arranca el degradado y es
# el que tine los halos: es el color que "sangra" hacia afuera de la ventana.
$violeta        = rgba(6a00f4ff)

# EL COLOR DE LA CASA. El amatista de siempre, el que ya esta en la barra, el
# dock y el bloqueo. Es el medio del degradado y el que debe reconocerse como
# "el color del sistema".
$amatista       = rgba(b16cffff)

# El amatista subido de vueltas. Mismo tono, mas brillo: es el que convierte el
# borde en algo encendido en vez de pintado.
$neon           = rgba(c77dffff)

# El punto mas caliente, casi blanco. Es el nucleo del tubo de neon. Va SOLO al
# final del degradado y en cantidades pequenas — si se usa como color de
# relleno deja de ser luz y pasa a ser un lila palido.
$luz            = rgba(e4c7ffff)


# ---------------------------------------------------------------------------
# TEXTO
# ---------------------------------------------------------------------------
# El texto principal usa $luz, que ya esta arriba. Aqui va solo el secundario.

# Lo que se lee pero no se mira: la fecha del bloqueo, el numero de un escritorio
# vacio, el volumen silenciado. $apagado (el del borde inactivo) es demasiado
# oscuro para texto — sobre negro no se leeria. Este es su equivalente subido de
# brillo, mismo tono de familia.
$tenue          = rgba(8a7aa8ff)


# ---------------------------------------------------------------------------
# LOS DOS QUE NO SON VIOLETA, Y POR QUE
# ---------------------------------------------------------------------------
# La regla de esta paleta es que un color se gana su sitio por tener un PAPEL.
# "Algo va mal" es un papel, y es el unico que el violeta no puede hacer: si el
# aviso fuera violeta como todo lo demas, dejaria de ser un aviso.
#
# Solo se usan donde SIGNIFICAN algo — sensor en critico, contrasena fallida,
# comprobando. Nunca como decoracion. Lo que antes eran acentos decorativos
# (ambar en la CPU, rosa en la temperatura, los dos azules de red y memoria) se
# paso a la familia violeta a proposito.

$alerta         = rgba(eb6f92ff)   # rojo  — algo va mal, mirame ya
$atencion       = rgba(f6c177ff)   # ambar — en marcha, espera


# ---------------------------------------------------------------------------
# HALOS Y SOMBRAS — los mismos tonos, pero dejando ver a traves
# ---------------------------------------------------------------------------

# El resplandor interior de la ventana activa. Alfa alto (cc = 80%) para que se
# note de verdad, con el tono neon y no el amatista base.
$glow_activo    = rgba(c77dffcc)

# La luz que la ventana activa derrama hacia afuera, sobre el fondo. Es el
# grave del degradado, no el agudo: si se usara el neon aqui, el halo taparia
# al borde en vez de acompanarlo.
$halo           = rgba(6a00f4aa)

# La sombra de lo que NO tiene el foco. Negra de verdad, sin violeta: lo que no
# usas no emite luz, se hunde. Esta es la pieza que hace que el contraste
# funcione — si todo brillara, no brillaria nada.
$sombra         = rgba(000000cc)
