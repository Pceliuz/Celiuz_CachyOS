# GENERADO POR hypr/scripts/gen-colores.py — NO EDITAR A MANO.
#
# La paleta para el MARCADO PANGO de hyprlock (placeholder_text y
# fail_text), que no entiende el rgba() de hyprlang y quiere #RRGGBB.
#
# La doble almohadilla es el escape de hyprlang para una # literal: no
# es una errata, y sin ella el resto de la linea seria un comentario.
#
# Sin alfa a proposito: en Pango la transparencia es el atributo
# `alpha=`, aparte del color.

$pango_negro       = ##000000
$pango_abismo      = ##0d0418
$pango_superficie  = ##1a0830
$pango_apagado     = ##2d1b4e
$pango_violeta     = ##6a00f4
$pango_amatista    = ##b16cff
$pango_neon        = ##c77dff
$pango_luz         = ##e4c7ff
$pango_tenue       = ##8a7aa8
$pango_alerta      = ##eb6f92
$pango_atencion    = ##f6c177
$pango_glow_activo = ##c77dff
