# general.conf — gaps, grosor de borde, layout (dwindle/master).

general {
    # Sin margenes. Por defecto Hyprland deja 20px alrededor de la pantalla
    # (gaps_out) y 5px entre ventanas (gaps_in): ese era el marco grueso que
    # rodeaba cada app al abrirla. A cero, cada ventana ocupa todo lo que le
    # toca, borde a borde de la pantalla.
    gaps_in = 0
    gaps_out = 0

    # 1px es lo unico que separa dos ventanas pegadas ahora, y es lo que dice
    # cual tiene el foco. A 0 no se distinguiria donde acaba una y empieza otra.
    border_size = 1

    col.active_border = rgba(b16cffff)
    col.inactive_border = rgba(2a1f3dcc)

    # Redimensionar arrastrando el borde con el puntero.
    resize_on_border = true

    layout = dwindle
}
