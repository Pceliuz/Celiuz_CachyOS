# decoration.conf — rounding, blur, sombras, glow, opacidad.
#
# La paleta es la misma de la barra y del bloqueo, para que todo sea la misma
# casa: amatista #b16cff para lo que tiene el foco, violeta profundo #1a0830
# para lo que se hunde al fondo.

decoration {
    # --- Esquinas ---
    # 10px. Va de la mano con `gaps_in = 4` de general.conf: las esquinas
    # redondeadas NECESITAN un hueco donde vivir. Con gaps a 0 las ventanas se
    # tocan, y donde se juntan dos esquinas curvas queda un agujero con forma
    # de rombo por el que se ve el fondo. Si algun dia vuelves a gaps 0, baja
    # esto a 0 tambien o se vera roto.
    rounding = 10

    # 2 = circunferencia (el default). Al subirlo la curva se aplana en el
    # medio y se cierra de golpe en las puntas: es el "squircle" de iOS/macOS.
    # A 3 se nota sin llegar a parecer un cuadrado.
    rounding_power = 3

    # --- Opacidad ---
    # Todo opaco A PROPOSITO. La transparencia global haria translucidos
    # tambien Brave, Steam y los juegos, con el video del fondo moviendose por
    # detras. Cuando quieras una app translucida, va por windowrule en
    # windowrules.conf (una a una), no aqui. kitty ya trae la suya propia
    # (background_opacity 0.6 en kitty.conf), que no depende de Hyprland.
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    # --- Atenuado de la ventana sin foco ---
    # Es la alternativa barata a la transparencia: la ventana que no usas se
    # oscurece un poco y la activa "sale hacia adelante". A diferencia de bajar
    # la opacidad, NO deja pasar el video del fondo, asi que no distrae.
    #
    # 0.30 (de 0.12 -> 0.20 -> 0.30, subido en dos tandas a peticion tuya).
    # Ademas de marcar el foco, es una de las piezas del efecto OLED: al hundir
    # hacia el negro todo lo que no estas usando, el color de la ventana activa
    # es el unico que queda a plena intensidad, y por contraste resalta mas sin
    # tocarle el brillo.
    #
    # OJO con dim_strength: el valor por defecto es 0.5, que deja la otra
    # ventana practicamente apagada e ilegible. A 0.30 ya se empieza a notar al
    # leer texto en la ventana de al lado — que es justo la gracia, pero es el
    # limite antes de que estorbe. Si algun dia hace falta una excepcion para
    # una app concreta, hay regla por ventana: `windowrule = match:class ^(x)$,
    # nodim on` en windowrules.conf.
    dim_inactive = true
    dim_strength = 0.30

    # --- Sombra ---
    # Ya venia encendida (es `true` por defecto), pero con range 4 y color
    # negro casi no se veia. Aqui se agranda y se tine de violeta.
    #
    # Con gaps de 4px las ventanas en mosaico apenas la lucen: donde de verdad
    # se aprecia es en las FLOTANTES — las kitty de monitoreo (monitor-tui), el
    # gestor del dock y el panel de calendario — que es lo que se quiere, que
    # se despeguen del resto.
    # Aqui cada color hace un papel OPUESTO a proposito:
    #   - la activa derrama luz violeta ($halo), o sea la sombra deja de ser
    #     sombra y pasa a ser resplandor;
    #   - la inactiva tira una sombra NEGRA de verdad ($sombra), sin nada de
    #     violeta, y se hunde en el fondo.
    # Es la mitad barata del efecto: si todo brillara, no brillaria nada. El
    # contraste entre las dos es lo que hace que la activa parezca encendida.
    #
    # Efecto lateral util: con los 4px de gaps_in, el halo de la activa llena
    # la juntura con las de al lado, asi que las costuras entre ventanas se ven
    # como una linea de luz violeta en vez de dejar asomar el video del fondo.
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = $halo
        color_inactive = $sombra
        offset = 0 4
    }

    # --- Glow: resplandor interior en la ventana activa ---
    # Opcion nueva de Hyprland (viene apagada por defecto). Enciende un halo
    # por dentro del borde. Con el borde de 1px de general.conf costaba ver de
    # un vistazo que ventana tenia el foco; asi la activa queda iluminada.
    #
    # color_inactive en alfa 0 = las ventanas sin foco NO brillan. Si se deja
    # sin poner, Hyprland cae de vuelta a `color` y brillarian todas, que es
    # justo lo contrario de lo que se busca.
    # Usa $glow_activo (el tono neon al 80%), no el amatista base: el borde ya
    # lleva el amatista, y si el halo fuera del mismo color se sumarian en una
    # mancha. Al ser el halo medio tono mas alto, el borde se lee como el
    # nucleo encendido y el glow como lo que ese nucleo desprende.
    #
    # render_power 3 = la caida es rapida. Un halo que se apaga pronto parece
    # luz; uno que se estira parece niebla de color.
    glow {
        enabled = true
        range = 16
        render_power = 3
        color = $glow_activo
        color_inactive = rgba(00000000)
    }

    # --- Blur ---
    # ESTO YA ESTABA FUNCIONANDO antes de escribir este archivo: `enabled` es
    # true por defecto, asi que kitty (0.6 de opacidad) lleva cristal
    # esmerilado desde siempre. Se anota con sus valores de fabrica para no
    # cambiar nada por sorpresa y para tener donde afinar.
    #
    # Coste: detras hay un video en marcha, asi que el blur se recalcula en
    # cada fotograma mientras haya algo translucido a la vista.
    #
    # Pendiente aun: blur en las CAPAS con `ignorealpha`, que borrosea solo
    # donde hay pixeles opacos — cristal bajo las pastillas de la waybar al
    # pasar el puntero, sin tocar la barra invisible. Eso va por layerrule en
    # windowrules.conf, no aqui.
    blur {
        enabled = true

        # `size 6, passes 3` da un desenfoque mas limpio que `size 8, passes 1`
        # por un coste parecido: mas pasadas suavizan, mas tamano solo estira.
        size = 6
        passes = 3
        new_optimizations = true

        # ESTAS TRES SON EL EFECTO OLED, y son lo que hace que kitty no se
        # llene de la luz del video que tiene detras:
        #   brightness < 1 apaga lo que se cuela por el cristal, asi que el
        #     fondo de la terminal tiende al negro en vez de al gris claro;
        #   vibrancy sube la saturacion de lo que SI queda, para que el poco
        #     color que pasa sea color de verdad y no un lavado;
        #   contrast separa las luces de las sombras y evita el gris medio.
        # Es exactamente lo que hace un panel OLED: negro que es negro, y el
        # color que sobrevive, saturado.
        brightness = 0.80
        vibrancy = 0.35
        contrast = 1.10
    }
}
