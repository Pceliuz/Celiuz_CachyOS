# autostart.conf — exec-once: waybar, launcher-daemon, notificaciones, wallpaper, idle/lock, etc.
# Se ira llenando conforme instalemos cada componente (pasos 4, 5, 6).

# Paso 3 — barra de estado y dock. Config en ~/dotfiles/waybar/ (symlink a ~/.config/waybar).
# No se lanza waybar directamente: el demonio arranca las cuatro instancias (la
# barra de arriba y el dock de abajo, cada una con su linea-tirador) y gestiona
# el auto-ocultado de las dos.
exec-once = $HOME/.config/hypr/scripts/waybar-autohide.py

# Auto-bloqueo por inactividad (hypridle, repo oficial cachyos-extra-v3).
# Los tiempos y el porque de cada uno estan en ~/dotfiles/hypr/hypridle.conf,
# que hypridle encuentra solo: ~/.config/hypr es un enlace a ~/dotfiles/hypr.
#
# Se arranca por su unidad de systemd y no con `exec-once = hypridle` a pelo,
# por tres cosas que la unidad da gratis:
#   - `Restart=on-failure`: si el demonio se cae, el auto-bloqueo dejaria de
#     funcionar EN SILENCIO. Asi se levanta solo.
#   - `PartOf=graphical-session.target`: se muere con la sesion, sin huerfanos.
#   - Cae en `app.slice` como un .service, y lib/congelar.py solo congela
#     unidades `.scope`, asi que el bloqueo no puede congelar a quien lo
#     gobierna.
# La orden va aqui y no con `systemctl --user enable` a proposito: enable deja
# estado fuera del repo, y este archivo tiene que contar la sesion entera.
exec-once = systemctl --user start hypridle

# Notificaciones (mako, repo oficial extra). Es quien atiende
# org.freedesktop.Notifications por D-Bus: sin el, todo lo que mande
# `notify-send` se pierde sin dejar rastro.
#
# Por su unidad de systemd, por lo mismo que hypridle, y ademas por una razon
# propia: mako CAE EN app.slice COMO .service, y lib/congelar.py solo congela
# unidades `.scope`. Si se lanzara con `uwsm app --` como el resto de programas,
# tendria un scope propio y el bloqueo lo congelaria — y entonces cualquier app
# que mandara una notificacion con la pantalla bloqueada se quedaria esperando
# una respuesta por D-Bus que no llega.
#
# La unidad es `Type=dbus` con BusName=org.freedesktop.Notifications, asi que
# systemd espera a que mako coja el bus antes de darla por arrancada.
exec-once = systemctl --user start mako

# Aviso de que distribucion de teclado quedo puesta al arrancar (us o latam,
# ver conf/input.conf). El script espera a que mako coja el bus antes de mandar
# nada: `exec-once` no garantiza orden, y un aviso mandado antes de tiempo se
# pierde sin dejar rastro.
exec-once = $HOME/.config/hypr/scripts/teclado.py avisar

# Fondo de pantalla en video (mpvpaper, del repo oficial cachyos).
# El video activo es el enlace ~/dotfiles/hypr/wallpapers/current; para cambiarlo
# se usa scripts/set-wallpaper.sh, no se toca este archivo.
# Si aun no hay ninguno elegido, el script no hace nada y no molesta.
exec-once = $HOME/.config/hypr/scripts/wallpaper.sh
