# teclado-laptop.conf — lo que solo tiene sentido en un portatil.
#
# ESTE FICHERO NO SE CARGA SIEMPRE. Lo enchufa conf/local.conf, que escribe
# instalar.sh despues de preguntarle a scripts/lib/maquina.py si esta caja es un
# portatil. En un sobremesa no se lee ni una linea de aqui.
#
# Se carga DESPUES de input.conf y de keybinds.conf, y eso es a proposito: en
# hyprlang gana el ultimo que habla, asi que esto son correcciones sobre lo que
# ya dijeron los otros dos. Si lo cargaramos antes, input.conf lo pisaria y
# parecerian ajustes que "no hacen nada".


# --- El teclado interno recupera su Ctrl derecho ---------------------------
#
# input.conf pone `kb_options = lv3:switch`, que convierte el Ctrl DERECHO en
# AltGr. Ahi esta bien puesto: el Attack Shark X820 es ANSI de 75% y NO TIENE
# AltGr, asi que sin ese apano no hay tercer nivel y te quedas sin `@ \ ~ ^`.
#
# El problema es que el bloque `input {}` de Hyprland es global: se lo aplica a
# todo teclado conectado, tenga AltGr o no. Se ve en `hyprctl devices`, donde
# hasta el `power-button` sale con `o "lv3:switch"`.
#
# Y el teclado interno de un portatil SI tiene AltGr y SI tiene la tecla `<>`.
# O sea que heredaba el apano sin necesitarlo y perdia el Ctrl derecho a cambio
# de nada. Aqui se le devuelve.
#
# `at-translated-set-2-keyboard` no es un nombre de esta laptop: es como el
# kernel llama al teclado interno de practicamente cualquier portatil, porque
# todos cuelgan del mismo controlador (atkbd). Por eso esto le sirve tambien a
# quien clone el repo, sin tocar nada.
#
# Las distribuciones se repiten en vez de heredarse porque un bloque `device`
# con `kb_options` propio no arrastra lo demas del bloque global. Si se dejaran
# fuera, este teclado se quedaria en `us` a secas y SUPER+DEL no tendria entre
# que alternar.
device {
    name = at-translated-set-2-keyboard
    kb_layout = us,latam
    kb_variant = altgr-intl,
    kb_options =
}


# --- Touchpad ---------------------------------------------------------------
#
# input.conf solo apaga el scroll natural, que es lo unico que le importaba a un
# sobremesa con raton. Un portatil necesita el resto.
input {
    touchpad {
        # Tocar para hacer clic, sin llegar a hundir la superficie. Es lo que
        # espera cualquiera que venga de otro sistema.
        tap-to-click = true

        # Dos dedos = clic derecho, tres = clic central.
        clickfinger_behavior = true

        # Ignora el touchpad mientras escribes. Sin esto, la palma roza la
        # superficie a mitad de una frase y el cursor se va a otro parrafo: el
        # sintoma es "se me mueve el texto solo" y cuesta relacionarlo.
        disable_while_typing = true

        # Arrastrar sin mantener el dedo hundido: tocas, tocas y deslizas.
        # Se apaga el "bloqueo" porque deja el arrastre pegado hasta que vuelves
        # a tocar, y se siente como si la ventana se hubiera quedado enganchada.
        tap-and-drag = true
        drag_lock = false

        natural_scroll = false
    }

    # Cuanto responde el touchpad. Va aparte del `sensitivity = 0` de input.conf
    # porque ese esta calibrado para el raton, que en el mismo valor se queda
    # corto aqui: cruzar la pantalla pidiendo tres pasadas de dedo.
    accel_profile = adaptive
}


# --- Brillo de la pantalla --------------------------------------------------
#
# En este portatil las teclas de brillo NO salen del teclado: las emite el
# `Video Bus` de ACPI, un dispositivo aparte (comprobado en
# /proc/bus/input/devices). Da igual para el bind —Hyprland recibe el simbolo
# igual—, pero explica por que no aparecen al pulsar el teclado con
# `xkbcli interactive-wayland`.
#
# `bindel`: la `e` es que repite si mantienes pulsado, la `l` es que sigue
# funcionando con la pantalla bloqueada. Las dos hacen falta: subir el brillo de
# uno en uno seria inutil, y a oscuras se sube el brillo ANTES de entrar.
#
# brightnessctl escribe por logind cuando /sys/class/backlight es de root, que
# es el caso normal. No hace falta regla udev ni estar en el grupo `video`.
# `-n` al bajar es el suelo: deja el minimo en 1 y nunca en 0. Sin el, bajando
# de 5 en 5 se llega a apagar la retroiluminacion del todo, y una pantalla negra
# que no responde al brillo es indistinguible de un equipo colgado.
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -n set 5%-


# --- Modo avion y camara ----------------------------------------------------
#
# En este portatil las emite `Ideapad extra buttons`, un tercer dispositivo
# distinto del teclado y del Video Bus. En otros portatiles salen del teclado; da
# igual, el simbolo que llega a Hyprland es el mismo.
#
# SIN COMPROBAR, y se dice claro: probarlo aqui significaba tumbar la wifi de la
# sesion en la que estabamos trabajando. El riesgo real no es que no funcione,
# es que funcione DOS VECES: en algunos portatiles el propio kernel ya conmuta el
# rfkill al pulsar la tecla, y entonces este bind lo devuelve a donde estaba y
# parece que la tecla no hace nada.
#
# Como saber cual es tu caso: comenta esta linea, recarga con SUPER+SHIFT+R y
# pulsa la tecla mirando `rfkill list`. Si ya conmuta sola, dejala comentada.
# Necesita estar en el grupo `rfkill` (o una regla polkit) para escribir en
# /dev/rfkill.
bindl = , XF86RFKill, exec, rfkill toggle all

# La tecla de la camara (`XF86WebCam`) se queda SIN asignar a proposito: no hay
# ninguna accion obvia y util detras. Tapar la camara por software no la apaga
# de verdad, y arrancar una app de video al pulsarla es de esas cosas que
# sorprenden mas de lo que ayudan. Si algun dia le encuentras uso, es
#     bindl = , XF86WebCam, exec, <lo que sea>


# --- La tapa ----------------------------------------------------------------
#
# Al cerrarla se bloquea la sesion, con el mismo lock.sh de SUPER+L: misma
# pantalla, mismo congelado de apps, mismas barras restauradas al volver.
#
# `bindl` (la `l` de "locked") es obligatorio aqui: sin ella el bind no dispara
# con la sesion ya bloqueada, y cerrar la tapa dos veces seguidas se quedaria
# sin hacer nada.
#
# `Lid Switch` es el nombre que reporta `hyprctl devices` en el apartado
# switches. Es el nombre estandar del interruptor de tapa en Linux.
#
# NO se suspende a proposito. Suspender y volver es justo donde aparecen los
# problemas feos en Wayland (mas con NVIDIA), y el sintoma seria "cierro la tapa
# y pierdo la sesion". Si algun dia lo quieres, la linea es:
#     bindl = , switch:on:Lid Switch, exec, systemctl suspend
bindl = , switch:on:Lid Switch, exec, $HOME/.config/hypr/scripts/lock.sh

# Al abrir, la pantalla vuelve. Hace falta decirlo: si la tapa se cerro con el
# monitor ya apagado por hypridle, Hyprland no lo enciende solo al abrirla y te
# encuentras una pantalla negra que parece un cuelgue. Es el mismo salvavidas
# que SUPER+SHIFT+D.
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on
