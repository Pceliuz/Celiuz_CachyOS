# nada.conf — vacio a proposito. No borrar.
#
# hyprlang no tiene condicionales: no hay forma de escribir "carga esto solo si
# estamos en un portatil" dentro de un .conf. Lo que si se puede es que el
# `source` del final de hyprland.conf apunte a una variable, y que instalar.sh
# decida a donde apunta:
#
#     portatil   ->  conf/teclado-laptop.conf
#     sobremesa  ->  este fichero
#
# O sea que "no cargar nada" hay que escribirlo como "cargar un fichero que no
# tiene nada dentro". Si lo borras, un sobremesa arranca con un error de
# hyprlang por un source que no encuentra su fichero.
