# windowrules.conf — reglas por ventana (flotante, opacidad, workspace fijo segun app).
# Aqui van las reglas especificas de tu flujo de seguridad (VMs, Burp, etc). Paso 6.

# --- Terminales de consulta rapida (btop, nmtui) ---
# Flotantes y centradas: son ventanas para mirar un momento y cerrar. Si
# entraran en el mosaico le robarian la mitad de la pantalla a lo que estuvieras
# usando, que es justo lo que no se quiere al echar un vistazo.
#
# La clase "monitor-tui" no es de kitty: se la pasamos nosotros con
# `kitty --class monitor-tui` desde los clicks de waybar, para que floten SOLO
# esas terminales y no todas las kitty que tengas abiertas.
#
# OJO con la sintaxis: Hyprland 0.53 rehizo por completo las windowrule. Ahora
# el criterio va PRIMERO (match:...) y cada efecto lleva su valor (`float on`,
# no `float` a secas). La forma antigua (`windowrule = float, class:^(x)$`) se
# rechaza con "invalid field float: missing a value" — sale en `hyprctl
# configerrors`, no en la salida de `hyprctl reload`, que igual dice "ok".
windowrule = match:class ^(monitor-tui)$, float on, center on, size 1100 640

# --- Reglas de capa (layerrule) ---
# Los namespaces salen del campo "name" de cada .jsonc de waybar.
# OJO con la sintaxis: desde Hyprland 0.53 el objetivo va como
# `match:namespace <nombre>`. La forma vieja (`, waybar-main` a secas) ya no
# se acepta y falla con "invalid field: missing a value".
#
# Estas reglas solo actuan al CREAR y DESTRUIR la capa, o sea al arrancar y
# cerrar waybar — no en el auto-ocultado, porque al ocultarse waybar conserva
# la superficie y solo la baja de capa. La animacion del auto-ocultado es el
# fundido CSS de ~/dotfiles/waybar/style.css.
layerrule = animation fade, match:namespace waybar-main
layerrule = animation fade, match:namespace waybar-trigger
layerrule = animation fade, match:namespace waybar-dock
layerrule = animation fade, match:namespace waybar-dock-trigger
