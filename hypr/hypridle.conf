# ~/.config/hypr/hypridle.conf  (-> ~/dotfiles/hypr/hypridle.conf)
#
# Auto-bloqueo por inactividad. hypridle lee este archivo solo, sin banderas,
# porque ~/.config/hypr es un enlace a ~/dotfiles/hypr.
#
# =============================================================================
# ANTES DE TOCAR ESTO: LEE ESTO
# =============================================================================
# El 2026-07-27, montando justamente esta pieza, se ejecuto
# `hyprctl dispatch dpms` en la sesion de verdad solo para comprobar que el
# dispatcher existia. SIN ARGUMENTO, dpms APAGA el monitor: Hyprland contesta
# `ok`, la pantalla se queda negra y no vuelve sola. El usuario lo vivio como
# "me apagaste la PC sin apagarla" y hubo que reiniciar a lo bruto.
#
# De ahi salen dos cosas que estan puestas a proposito:
#   - El bind de rescate SUPER+SHIFT+D (conf/keybinds.conf) enciende la pantalla
#     aunque este negra: Hyprland sigue leyendo el teclado con el monitor
#     apagado. Es el salvavidas si algun dia on-resume fallara.
#   - Un cerrojo en ~/.claude/hooks/guard-sesion.py que deniega `dpms off`,
#     `dpms` a secas, hypridle y hyprlock sobre la sesion real. Solo deja pasar
#     `dpms on`, que es el rescate.
#
# =============================================================================
# COMO SE DESPIERTA
# =============================================================================
# Solo el input REAL de hardware (raton o teclado) reinicia el contador. Esta
# comprobado en un Hyprland anidado: `hyprctl dispatch movecursor`,
# `sendshortcut`, `cyclenext` y `workspace` NO cuentan como actividad, asi que
# no sirven para probar el despertar desde un script. Es el protocolo
# ext-idle-notify, no un fallo de la config.
#
# =============================================================================
# QUE NO LO DISPARA
# =============================================================================
# - El fondo de pantalla en video NO estorba, aunque mpv tenga
#   `stop-screensaver=yes`. Comprobado en anidado con mpvpaper reproduciendo:
#   los temporizadores saltan igual. mpvpaper pinta con la API de render de
#   libmpv, sin ventana propia, asi que nunca llega a crear un inhibidor.
# - Lo que SI para el contador son las apps que piden inhibir por D-Bus
#   (navegador con un video a pantalla completa, Steam, reproductores). Eso es
#   lo que se quiere: no bloquear mientras ves algo. Se respeta porque
#   ignore_dbus_inhibit se queda en false.

general {
    # Lo que se ejecuta cuando algo pide bloquear por D-Bus (`loginctl
    # lock-session`, la tapa del portatil...). `pidof` evita apilar dos
    # hyprlock si llegan dos ordenes seguidas.
    lock_cmd = pidof hyprlock || $HOME/.config/hypr/scripts/lock.sh

    # Bloquear ANTES de suspender, no despues: si no, hay un instante con la
    # pantalla ya encendida y el escritorio a la vista al volver.
    before_sleep_cmd = loginctl lock-session

    # Al volver de suspension la pantalla puede quedarse apagada esperando una
    # tecla. Esto la enciende sola.
    after_sleep_cmd = hyprctl dispatch dpms on

    # Los dos en false (que es el valor por defecto, se escriben para que se
    # vea): se RESPETA a quien pida no dormir. Ponerlos en true haria que la
    # pantalla se bloquee en mitad de una pelicula.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# --- 10 min: bloquear ---------------------------------------------------------
# Se llama a lock.sh y no a hyprlock directo por lo mismo que el bind SUPER+L:
# se despega con setsid -f y lleva bucle vigilante. Es exactamente el mismo
# bloqueo que sale con SUPER+L, con su fondo de video y su escritorio vacio.
#
# OJO con el congelado: lock.sh congela las apps que no sean juegos ni
# terminales, y ahora esto salta SOLO, estando tu lejos. Una descarga del
# navegador se quedaria parada hasta que vuelvas (las de Steam no: Steam cuenta
# como juego, y las terminales nunca se congelan). Si te molesta, anade "brave"
# a `nunca_congelar` en hypr/congelar-excepciones.json.
listener {
    timeout = 600
    on-timeout = pidof hyprlock || $HOME/.config/hypr/scripts/lock.sh
}

# --- 12 min: apagar el monitor ------------------------------------------------
# Dos minutos despues del bloqueo, no antes: asi nunca se apaga la pantalla con
# el escritorio a la vista.
#
# La sintaxis es `dpms off` / `dpms on`. La config de ejemplo que trae el
# paquete usa `hyprctl dispatch 'hl.dsp.dpms({action = "off"})'`, que en
# Hyprland 0.56.1 responde "Invalid dispatcher": es de una version mas nueva.
# Comprobado con `dpms on`, que es inocuo.
listener {
    timeout = 720
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# --- NO se suspende la maquina ------------------------------------------------
# La config de ejemplo trae un `systemctl suspend` a los 30 min. Aqui no se
# pone, y es una decision, no un olvido: es una PC de escritorio que se queda
# con descargas de Steam, compilaciones y escaneos de laboratorio corriendo
# solos. Suspender los cortaria. Si algun dia lo quieres, es este bloque:
#
#   listener {
#       timeout = 1800
#       on-timeout = systemctl suspend
#   }
