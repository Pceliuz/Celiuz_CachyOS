# hypr/hyprlock-pantalla.conf — PLANTILLA del contenido del bloqueo, UNA
# pantalla. No la lee hyprlock: scripts/lib/pantalla.py la copia una vez por
# pantalla en ~/.cache/celiuzpaper/lock-pantallas.conf, cambiando @PANTALLA@ por
# su nombre y cada $lock_* por SU medida. Asi cada monitor lleva su tamano.
#
# Antes esto vivia en hyprlock.conf con `monitor =` vacio y las medidas de la
# pantalla del FOCO: con dos pantallas distintas (2560x1440 y 1920x1080), la otra
# salia con letras de otro tamano y fuera de sitio, y al reves segun donde
# estuviera el foco al bloquear (2026-11-18). hyprlang no deja que una variable
# valga distinto en cada pantalla, asi que se genera un bloque por pantalla.
#
# Si la generacion fallara, lock.sh copia esto con @PANTALLA@ vacio (todas las
# pantallas) y las variables de hyprlock.conf: el bloqueo se dibuja igual.


# Velo sobre la imagen: sin el, un fondo claro se come el texto. Es un `shape` a
# pantalla completa y no un color de fondo porque el fondo ya lleva la imagen.
#
# EL TAMANO VA EN PORCENTAJE, y no es un detalle de estilo. Con `1920, 1080`
# escrito a mano el velo NO se estiraba a la pantalla: en la laptop (1366x768)
# salia un rectangulo de 1089x612 pegado a la esquina de arriba a la izquierda
# —el 63% de la pantalla— con un escalon bien visible entre la zona oscurecida y
# la que se quedaba clara. hyprlock no recorta ni centra un `shape` mas grande
# que la salida: lo reescala, y el resultado no es ni el pedido ni la pantalla.
# Con `100%, 100%` mide la salida y cubre justo, en los dos equipos.
shape {
    monitor = @PANTALLA@
    size = 100%, 100%
    color = rgba(0d04184d)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

# --- La banda de la izquierda -------------------------------------------------
# Ya no hay tarjeta flotante. Todo el bloque vive en una columna pegada al borde
# izquierdo, y esta banda es su fondo: asi el resto de la pantalla —el personaje
# del wallpaper— se ve entero, que era el problema del diseno anterior, con la
# tarjeta justo encima de la cara.
#
# El ANCHO viene medido (`$lock_banda_w`) y el ALTO va en porcentaje, por lo
# mismo que el velo: un numero escrito a mano no cubre la pantalla de al lado.
shape {
    monitor = @PANTALLA@
    size = $lock_banda_w, 100%
    color = rgba(0d04188c)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = left
    valign = center
}

# El filo amatista del borde derecho. Es un `shape` propio y no el `border_size`
# de la banda porque aquel dibujaria los cuatro lados, y arriba y abajo se verian
# dos rayas cruzando la pantalla. Su x la calcula pantalla.py: hyprlang no resta.
shape {
    monitor = @PANTALLA@
    size = 2, 100%
    color = rgba(b16cff4d)
    rounding = 0
    border_size = 0
    position = $lock_banda_borde_x, 0
    halign = left
    valign = center
}

# --- El titulo y el usuario: CENTRADOS EN LA BANDA ----------------------------
# `halign = center` centra en la PANTALLA y luego suma `position`, asi que para
# dejarlos en el centro de la banda hay que correrlos a la izquierda la
# diferencia entre los dos centros. Ese numero es `$lock_col_centro`, negativo, y
# lo calcula pantalla.py porque depende del ancho del monitor: en el sobremesa y
# en el portatil NO vale el mismo.
#
# Y se hace asi, y no con `halign = left` y una x fija, porque alineando a la
# izquierda habria que saber cuanto MIDE el texto para centrarlo — y eso cambia
# con la fuente, con el idioma y con los kanji del titulo.
#
# 彼岸花 (higanbana) se cambia aqui y en ningun otro sitio. La fuente cae en Noto
# Sans CJK para los kanji, que ya esta instalada.
label {
    monitor = @PANTALLA@
    text = 彼岸花
    color = $amatista
    font_size = $lock_titulo
    font_family = Noto Sans CJK TC
    position = $lock_col_centro, $lock_titulo_y
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0d0418cc)
}

label {
    monitor = @PANTALLA@
    text = $USER
    color = $tenue
    font_size = $lock_usuario
    font_family = MesloLGS Nerd Font Bold
    position = $lock_col_centro, $lock_usuario_y
    halign = center
    valign = center
}

# --- El resto de la columna: ALINEADO A LA IZQUIERDA --------------------------
# Aqui si vale `halign = left`, porque no hay que centrar nada: la x es
# directamente el margen izquierdo del bloque, y el texto crece hacia la derecha.

# El reloj, que es lo que se lee de lejos.
label {
    monitor = @PANTALLA@
    text = $TIME
    color = $luz
    font_size = $lock_reloj
    font_family = MesloLGS Nerd Font Bold
    position = $lock_col_x, $lock_reloj_y
    halign = left
    valign = center

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0d0418e6)
}

# La fecha, en espanol. El formato es "sabado · 08 de agosto".
#
# NO se fuerza el idioma aqui. Antes ponia `LC_TIME=es_PE.utf8`, y en esta laptop
# salia "Saturday · 01 de August": es_PE no estaba generado en el sistema, y
# cuando un locale no existe glibc no busca otro parecido, se cae al C de fabrica,
# que es ingles. Cablear un pais es ademas lo que este repo no debe hacer: el
# equipo de al lado puede tener otro.
#
# Sin el prefijo, `date` hereda el LC_TIME de la sesion y sale en espanol. Los
# nombres de dia y mes son iguales en todos los locales de espanol.
label {
    monitor = @PANTALLA@
    text = cmd[update:30000] date "+%A · %d de %B"
    color = $tenue
    font_size = $lock_fecha
    font_family = MesloLGS Nerd Font
    position = $lock_col_x, $lock_fecha_y
    halign = left
    valign = center
}

# --- La contrasena -----------------------------------------------------------
# Los puntos se encienden en amatista al escribir, el borde avisa en rojo si
# fallas y en ambar mientras comprueba.
input-field {
    monitor = @PANTALLA@
    size = $lock_campo_w, $lock_campo_h
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    outer_color = $amatista
    inner_color = rgba(1a0830db)
    font_color = $luz
    check_color = $atencion
    fail_color = $alerta

    fade_on_empty = false
    # Medido, no escrito: es el unico redondeo visible que queda —la banda y el
    # velo van a esquina viva— y en una pantalla mas pequena un 14 fijo se ve
    # desproporcionado, que es justo lo que pantalla.py existe para evitar.
    rounding = $lock_rounding
    placeholder_text = <span foreground="$pango_tenue">contraseña</span>
    fail_text = <span foreground="$pango_alerta">$FAIL  ·  intento $ATTEMPTS</span>
    hide_input = false

    position = $lock_col_x, $lock_campo_y
    halign = left
    valign = center

    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(b16cff66)
}

# --- La fila de datos ---------------------------------------------------------
# Bateria, teclado y red. Lo escribe scripts/lock-info.sh en UNA linea con
# marcado Pango, y por eso es una sola etiqueta y no tres: tres necesitarian tres
# posiciones en x, y hyprlang no sabe sumar. Ademas, lo que no aplica en este
# equipo —la bateria en un sobremesa— desaparece sin dejar hueco.
#
# Cada 20 s basta: son datos que cambian despacio y el script lee ficheros de
# /sys y pregunta a hyprctl, nada caro.
label {
    monitor = @PANTALLA@
    text = cmd[update:20000] $HOME/.config/hypr/scripts/lock-info.sh
    color = $tenue
    font_size = $lock_info
    font_family = MesloLGS Nerd Font
    position = $lock_col_x, $lock_info_y
    halign = left
    valign = center
}
