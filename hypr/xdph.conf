screencopy {
    allow_token_by_default = true

    # Quien contesta "¿que ventana o pantalla?" cuando un programa pide grabar o
    # compartir. grabar-portal.py contesta solo cuando grabar.sh le ha dejado
    # encargada una ventana (SUPER+R → «Una ventana»); en cualquier otro caso
    # —una videollamada, OBS— le pasa la pregunta a hyprland-share-picker, el
    # de siempre.
    #
    # Va por el PATH (el enlace ~/.local/bin/celiuz-grabar-portal que crea
    # instalar.sh), y NO por ruta: xdph lo lanza con execvp, sin shell, asi que
    # `~` no se expande, y una ruta absoluta seria la del equipo del autor. Con
    # una ruta que no existe el portal no avisa: contesta «sin seleccion» y la
    # grabacion de la ventana no arranca (medido el 2026-11-16).
    #
    # Se lee solo al arrancar: tras cambiar esto,
    #   systemctl --user restart xdg-desktop-portal-hyprland
    custom_picker_binary = celiuz-grabar-portal
}
