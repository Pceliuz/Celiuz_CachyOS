screencopy {
    allow_token_by_default = true

    # Quien contesta "¿que ventana o pantalla?" cuando un programa pide grabar o
    # compartir. grabar-portal.py contesta solo cuando grabar.sh le ha dejado
    # encargada una ventana (SUPER+R → «Una ventana»); en cualquier otro caso
    # —una videollamada, OBS— le pasa la pregunta a hyprland-share-picker, el
    # de siempre. xdph lo lanza con /bin/sh -c, asi que `~` se expande y la
    # ruta vale se clone el repo donde se clone (es el enlace de instalar.sh).
    # Leer la config solo al arrancar: tras cambiar esto,
    #   systemctl --user restart xdg-desktop-portal-hyprland
    custom_picker_binary = ~/.config/hypr/scripts/grabar-portal.py
}
