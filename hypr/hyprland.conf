# ~/dotfiles/hypr/hyprland.conf
# Punto de entrada. Solo une los modulos de abajo, no metas configs sueltas aqui.
#
# Orden de construccion (una cosa a la vez):
# 1. [x] Estructura
# 2. [x] Teclado y monitor      -> input.conf, monitors.conf
# 3. [x] Barra de estado        -> waybar (~/dotfiles/waybar/, fuera de hypr/)
# 4. [ ] Launcher                -> conf/keybinds.conf (bind del launcher) + app aparte
# 5. [ ] Visual                  -> general.conf, decoration.conf, animations.conf
# 6. [ ] Lo que vaya faltando   -> windowrules.conf, workspaces.conf, autostart.conf, env.conf, misc.conf

source = $HOME/dotfiles/hypr/conf/monitors.conf
source = $HOME/dotfiles/hypr/conf/input.conf
source = $HOME/dotfiles/hypr/conf/env.conf
source = $HOME/dotfiles/hypr/conf/autostart.conf
source = $HOME/dotfiles/hypr/conf/general.conf
source = $HOME/dotfiles/hypr/conf/decoration.conf
source = $HOME/dotfiles/hypr/conf/animations.conf
source = $HOME/dotfiles/hypr/conf/keybinds.conf
source = $HOME/dotfiles/hypr/conf/windowrules.conf
source = $HOME/dotfiles/hypr/conf/workspaces.conf
source = $HOME/dotfiles/hypr/conf/misc.conf
