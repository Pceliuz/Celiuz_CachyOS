# ~/dotfiles/hypr/hyprland.conf
# Punto de entrada. Solo une los modulos de abajo, no metas configs sueltas aqui.
#
# Orden de construccion (una cosa a la vez):
# 1. [x] Estructura
# 2. [x] Teclado y monitor      -> input.conf, monitors.conf
# 3. [x] Barra de estado        -> waybar (~/dotfiles/waybar/, fuera de hypr/)
# 4. [x] Launcher                -> conf/keybinds.conf (bind del launcher) + app aparte
# 5. [x] Visual                  -> colores.conf, general.conf, decoration.conf, animations.conf
# 6. [ ] Lo que vaya faltando   -> windowrules.conf, workspaces.conf, autostart.conf, env.conf, misc.conf

# colores.conf va EL PRIMERO: define las variables de la paleta ($amatista,
# $neon, $negro...) y las variables de hyprlang son sustitucion de texto, asi
# que tienen que existir antes de que cualquier modulo las use.
source = $HOME/.config/hypr/conf/colores.conf

# local.conf lo escribe instalar.sh y NO se versiona: es lo que cambia de una
# maquina a otra (ahora mismo, cual es tu terminal). Va aqui arriba por lo mismo
# que colores.conf: las variables de hyprlang son sustitucion de texto y tienen
# que existir antes de que un bind las use.
#
# Si Hyprland se queja de que no encuentra este fichero, es que falta pasar el
# instalador: ./instalar.sh
#
# $conf_maquina se declara ANTES de leerlo, con `nada.conf` de valor de fabrica,
# para que el `source` del final tenga siempre algo que abrir aunque local.conf
# no exista todavia o sea de una version anterior. Sin este valor por defecto,
# quien clone el repo y arranque antes de instalar se comeria un error de
# hyprlang por una variable sin definir.
$conf_maquina = $HOME/.config/hypr/conf/nada.conf
source = $HOME/.config/hypr/conf/local.conf

source = $HOME/.config/hypr/conf/monitors.conf
source = $HOME/.config/hypr/conf/input.conf
source = $HOME/.config/hypr/conf/env.conf
source = $HOME/.config/hypr/conf/autostart.conf
source = $HOME/.config/hypr/conf/general.conf
source = $HOME/.config/hypr/conf/decoration.conf
source = $HOME/.config/hypr/conf/animations.conf
source = $HOME/.config/hypr/conf/keybinds.conf
source = $HOME/.config/hypr/conf/windowrules.conf
source = $HOME/.config/hypr/conf/workspaces.conf
source = $HOME/.config/hypr/conf/misc.conf

# EL ULTIMO, y no es capricho: aqui va lo que depende de QUE CLASE DE EQUIPO es
# esto (ahora mismo, `conf/teclado-laptop.conf` en un portatil). Son correcciones
# sobre lo que ya dijeron input.conf y keybinds.conf, y en hyprlang gana el
# ultimo que habla: cargarlo antes lo dejaria pisado y sin efecto.
#
# Quien decide su valor es instalar.sh, escribiendolo en local.conf a partir de
# scripts/lib/maquina.py. En un sobremesa apunta a nada.conf, que esta vacio a
# proposito: hyprlang no tiene condicionales, asi que "no cargar nada" hay que
# escribirlo como "cargar un fichero sin nada dentro".
source = $conf_maquina
