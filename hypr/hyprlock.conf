# ~/dotfiles/hypr/hyprlock.conf
#
# La pantalla de bloqueo (SUPER+L, que llama a scripts/lock.sh).
#
# La idea es la misma tarjeta flotante que tenias antes, pero con la paleta de
# este escritorio —violeta profundo y amatista #b16cff— en vez del rojo, y con tu
# fondo de pantalla detras.
#
# COMO SE VE EL FONDO. Durante un tiempo dimos por cerrado que era imposible verlo
# en movimiento: un fondo translucido aqui NO ensena el escritorio, porque el
# protocolo de bloqueo de Wayland obliga al compositor a tapar lo que hay debajo
# (comprobado bajando el alfa al 6%: negro igual).
#
# Resulta que era cierto solo porque una opcion estaba apagada. Hyprland 0.56.1
# tiene `misc:session_lock_xray`, que levanta justo esa tapa. Con ella encendida y
# un fondo transparente aqui, se ve el VIDEO DEL FONDO MOVIENDOSE detras del
# bloqueo. lock.sh la enciende al bloquear y la apaga al desbloquear.
#
# El xray tiene un pero grande: no ensena solo el fondo, ensena TODO lo que hay
# debajo. En la prueba se leia el texto de una ventana y, con la barra puesta, la
# temperatura, la CPU, la RAM, el volumen y la IP. Por eso lock.sh salta a un
# escritorio vacio y esconde las barras ANTES de bloquear. Sin esa parte, el
# bloqueo dejaria de tapar nada.
#
# El modo de reserva sigue siendo el fotograma congelado (ffmpeg sobre el video).
# Se elige con MODO_FONDO en lock.sh.
#
# Nota de seguridad de hyprlock: si el proceso muere, la sesion se desbloquea. Por
# eso `grace = 0` y `ignore_empty_input = true`, para no dejar la puerta abierta
# por un intro de mas.

# LA PALETA. hyprlock habla hyprlang igual que Hyprland, asi que puede leer
# el mismo archivo de colores en vez de tener el violeta escrito otra vez.
# (waybar no puede: se estiliza con CSS, y para eso esta gen-colores.py.)
#
# Los colores SOLIDOS de aqui abajo son todos variables. Los que siguen siendo
# literales son TRANSPARENCIAS —las sombras y el velo—, y es por un limite de
# hyprlang: no sabe derivar un alfa de una variable. rgba(b16cff8c) es
# "$amatista al 55%", pero no hay forma de escribirlo asi. El CSS de la barra si
# puede (alpha(@amatista, 0.55)), por eso alli no queda ningun literal.
#
# Si cambias $amatista en colores.conf, acuerdate de estas: son 090312 (el
# oscuro del velo), 1a0830 (la tarjeta) y b16cff (los tres halos).
source = $HOME/.config/hypr/conf/colores.conf

# LAS MEDIDAS. Aqui estan las de una pantalla de 1920x1080, que es para la que se
# escribio todo esto, y JUSTO DEBAJO se cargan las de la pantalla que tengas.
#
# El orden es la parte importante y no es casual. hyprlang deja redefinir una
# variable y gana la ultima (medido en un Hyprland anidado: `$x = 5` seguido de
# `$x = 9` da 9), asi que el fragmento generado PISA estos numeros. Y si ese
# fragmento faltara —primera vez, cache borrada, un fallo al medir— hyprlock se
# queja de un `source` que no encuentra pero SIGUE, con los valores de aqui.
#
# Esa es toda la idea: una pantalla distinta se ve peor proporcionada, nunca se
# queda sin bloqueo. Con las medidas solo en el fichero generado, un fallo al
# medirlas dejaria la config llena de variables sin definir.
$lock_tarjeta_w = 330
$lock_tarjeta_h = 210
$lock_tarjeta_y = 60
$lock_rounding = 18
$lock_titulo = 26
$lock_titulo_y = 132
$lock_usuario = 13
$lock_usuario_y = 104
$lock_reloj = 54
$lock_reloj_y = 62
$lock_fecha = 12
$lock_fecha_y = 26
$lock_campo_w = 330
$lock_campo_h = 46
$lock_campo_y = -75

# Las de tu pantalla, que las escribe scripts/lock.sh antes de bloquear
# preguntandoselas a scripts/lib/pantalla.py. Se rehacen en cada bloqueo, asi que
# cambiar de monitor no deja medidas viejas.
source = $HOME/.cache/celiuzpaper/lock-medidas.conf

general {
    # OJO con los colores en hyprlock: solo acepta rgba() con 8 digitos hex
    # (rgba(b16cffff)) o con 4 numeros separados por comas. La forma
    # rgba(b16cff, 1.0) —que si vale en Hyprland— aqui falla color a color y la
    # pantalla sale sin estilo.
    #
    # `grace` (segundos de cortesia antes de pedir contrasena) no se pone aqui: en
    # esta version es argumento de linea de comandos, --grace, y por defecto es 0,
    # que es lo que queremos.
    hide_cursor = false
    # Un intro en vacio no cuenta como intento fallido.
    ignore_empty_input = true
}

# --- El fondo, que no se escribe aqui ----------------------------------------
# El bloque `background` lo GENERA scripts/lock.sh en ese archivo, justo antes de
# bloquear, porque hay dos formas de ensenar el fondo y se elige en el momento:
#
#   xray        Hyprland deja ver lo que hay debajo del bloqueo
#               (misc:session_lock_xray, que lock.sh enciende y apaga en caliente).
#               El bloque es TRANSPARENTE y lo que se ve es el video del fondo
#               EN MOVIMIENTO, de verdad, no una foto.
#   fotograma   El bloque lleva `path` al jpg que lock.sh saca del video con
#               ffmpeg. Fondo quieto, pero sin depender del xray.
#
# `source` funciona en hyprlock (comprobado el 2026-07-28 en un Hyprland anidado,
# fragmento cargado y fondo del color exacto que le puse) y expande `$HOME`.
#
# Si el archivo no existiera, hyprlock se queja pero sigue: saldria fondo negro.
# lock.sh lo escribe siempre antes de arrancar, asi que no deberia pasar.
source = $HOME/.cache/celiuzpaper/lock-fondo.conf

# Velo sobre la imagen: sin el, un fondo claro se come el texto del reloj. Es un
# `shape` a pantalla completa y no un color de fondo porque el fondo ya lleva la
# imagen. Va antes de la tarjeta para que quede por debajo.
#
# EL TAMANO VA EN PORCENTAJE, y no es un detalle de estilo. Con `1920, 1080`
# escrito a mano el velo NO se estiraba a la pantalla: en la laptop (1366x768)
# salia un rectangulo de 1089x612 pegado a la esquina de arriba a la izquierda
# —el 63% de la pantalla— con un escalon bien visible entre la zona oscurecida y
# la que se quedaba clara. hyprlock no recorta ni centra un `shape` mas grande
# que la salida: lo reescala, y el resultado no es ni el pedido ni la pantalla.
# Con `100%, 100%` mide la salida y cubre justo, en los dos equipos.
shape {
    monitor =
    size = 100%, 100%
    color = rgba(0903125c)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

# --- La tarjeta ---------------------------------------------------------------
# hyprlock no tiene "cajas": la tarjeta es una `shape`, y el halo se hace con las
# sombras (shadow_passes), que es de donde salia el resplandor rojo de la de antes.
shape {
    monitor =
    size = $lock_tarjeta_w, $lock_tarjeta_h
    # = $superficie al 86%. Va literal porque hyprlang no sabe derivar un
    # alfa de una variable (el CSS de la barra si: alpha(@superficie, .92)).
    color = rgba(1a0830db)
    rounding = $lock_rounding
    border_size = 2
    border_color = $amatista

    position = 0, $lock_tarjeta_y
    halign = center
    valign = center

    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(b16cff8c)
    shadow_boost = 1.2
}

# El titulo, arriba de la tarjeta. 彼岸花 (higanbana) es el que tenias puesto; se
# cambia aqui y nada mas. La fuente cae en Noto Sans CJK para los kanji, que ya
# esta instalada.
label {
    monitor =
    text = 彼岸花
    color = $luz
    font_size = $lock_titulo
    font_family = Noto Sans CJK TC
    position = 0, $lock_titulo_y
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(b16cffb2)
}

# El usuario, pequeno y en amatista, debajo del titulo.
label {
    monitor =
    text = $USER
    color = $amatista
    font_size = $lock_usuario
    font_family = MesloLGS Nerd Font Bold
    position = 0, $lock_usuario_y
    halign = center
    valign = center
}

# El reloj, que es lo que se lee de lejos.
label {
    monitor =
    text = $TIME
    color = $luz
    font_size = $lock_reloj
    font_family = MesloLGS Nerd Font Bold
    position = 0, $lock_reloj_y
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(090312e6)
}

# La fecha, en espanol. El formato es "sabado · 27 de julio".
#
# NO se fuerza el idioma aqui. Antes ponia `LC_TIME=es_PE.utf8` delante del
# `date`, y en esta laptop salia "Saturday · 01 de August": es_PE no estaba
# generado en el sistema, y cuando un locale no existe glibc no busca otro
# parecido, se cae al C de fabrica, que es ingles. Cablear un pais es ademas lo
# que este repo no debe hacer: el equipo de al lado puede tener otro.
#
# Sin el prefijo, `date` hereda el LC_TIME de la sesion (aqui es_MX.UTF-8, ya
# exportado por systemd) y sale en espanol. Los nombres de dia y mes son iguales
# en todos los locales de espanol, asi que da lo mismo cual sea el pais.
label {
    monitor =
    text = cmd[update:30000] date "+%A · %d de %B"
    color = $tenue
    font_size = $lock_fecha
    font_family = MesloLGS Nerd Font
    position = 0, $lock_fecha_y
    halign = center
    valign = center
}

# --- La contrasena -----------------------------------------------------------
# Va en su propia caja debajo de la tarjeta, como en la que tenias. Los puntos se
# encienden en amatista al escribir, el borde avisa en rojo si fallas y en ambar
# mientras comprueba.
input-field {
    monitor =
    size = $lock_campo_w, $lock_campo_h
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    outer_color = $amatista
    inner_color = rgba(1a0830db)
    font_color = $luz
    check_color = $atencion
    fail_color = $alerta

    fade_on_empty = false
    rounding = 14
    placeholder_text = <span foreground="##8b86a3">contrasena</span>
    fail_text = <span foreground="##eb6f92">$FAIL  ·  intento $ATTEMPTS</span>
    hide_input = false

    position = 0, $lock_campo_y
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(b16cff66)
}
