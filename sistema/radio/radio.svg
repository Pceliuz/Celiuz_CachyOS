<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Icono de «Wifi y Bluetooth sin cortes» (catalogo): las tres ondas del
       wifi, con un rayo de Bluetooth al lado. Empieza por <svg> y no por un
       comentario: gdk-pixbuf no reconoce un SVG que empiece por comentario
       (CLAUDE.md, trampas). Colores de fabrica de la paleta, como el de
       Celiuz Remoto. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d0418"/>
  <path d="M8 27 a26 26 0 0 1 34 0" fill="none" stroke="#c77dff" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M14 34 a17 17 0 0 1 22 0" fill="none" stroke="#c77dff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M20 41 a8 8 0 0 1 10 0" fill="none" stroke="#b16cff" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="25" cy="48" r="2.6" fill="#b16cff"/>
  <path d="M45 30 l10 9 l-5 4.5 v-18 l5 4.5 l-10 9" fill="none" stroke="#e4c7ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
