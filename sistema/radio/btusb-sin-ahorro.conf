# Celiuz (sistema/radio, lo copia `./instalar.sh --radio`): el Bluetooth USB
# sin suspension automatica. Con ella el adaptador se dormia a los 2 s y unos
# auriculares sonaban bien un rato y luego se cortaban a ratos (laptop, Realtek
# 0bda:c024 en el mismo chip que el wifi, 2026-10-22; con el celular, bien).
# Hace efecto al reiniciar; el instalador ademas lo despierta en el acto.
options btusb enable_autosuspend=0
