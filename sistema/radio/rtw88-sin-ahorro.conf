# Celiuz (sistema/radio, lo copia `./instalar.sh --radio`): el wifi Realtek de
# controlador rtw88 (RTL8821CE y familia) se quedaba atascado al salir del
# ahorro de energia («firmware failed to leave lps state», miles por sesion),
# con cortes y picos de 600 ms. Medido en la laptop el 2026-10-21: de 213 ms
# de media al router a 13,6 ms, y 0 errores. Hace efecto al reiniciar.
options rtw88_core disable_lps_deep=1
options rtw88_pci disable_aspm=1
