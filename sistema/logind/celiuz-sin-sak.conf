# Lo copia ./instalar.sh --sddm a /etc/systemd/logind.conf.d/ (se quita con
# --sddm-quitar). No edites la copia de /etc: la pisa la siguiente instalacion.
#
# Ctrl+Alt+Shift+Esc es la «Secure Attention Key» de logind (systemd 257+): le
# pide al gestor de inicio que saque su pantalla, y SDDM abre una NUEVA en otra
# terminal virtual, ENCIMA de la sesion bloqueada. Con el tema celiuz se parece
# al bloqueo, y al entrar por ella vuelves a la sesion... con el bloqueo aun
# puesto. Paso el 2026-10-25: la PC salio de Hyprland en mitad del bloqueo, las
# teclas pulsadas al salir no le llegaron al volver, la contraseña buena fallo
# tres veces en el bloqueo y pam_faillock cerro la cuenta 10 minutos.
[Login]
HandleSecureAttentionKey=ignore
