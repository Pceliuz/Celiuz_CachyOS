# /etc/mkinitcpio.conf.d/99-celiuz-hibernar-nvidia.conf
# Lo pone ./instalar.sh (paso 8c). Viene del repo de dotfiles: sistema/mkinitcpio/.
#
# Saca el driver de NVIDIA del initramfs para que HIBERNAR vuelva.
#
# chwd (10-chwd.conf) lo mete ahi para el arranque temprano, y con el driver ya
# cargado al restaurar, el kernel le pide que se congele antes de saltar a la
# imagen y el driver contesta que no:
#     nvidia 0000:01:00.0: PM: pci_pm_freeze(): nv_pmops_freeze [nvidia] returns -5
#     PM: hibernation: Failed to load image, recovering.
# La imagen se habia leido entera (10 GB en 4,8 s) y se tiraba: la PC arrancaba
# de cero y parecia que hibernar la «apagaba». Medido el 2026-11-18, driver
# 620.70.06. Sin el driver en el initramfs no hay nada que congelar; se carga
# despues, desde el disco, como cualquier otro modulo.
#
# Lo que cuesta: el logo de arranque sale con el framebuffer simple en vez de con
# el driver de NVIDIA (un parpadeo al cargar este). Nada mas.
#
# Va como fichero aparte y no editando 10-chwd.conf porque chwd lo reescribe.
# El 99 hace que se lea despues. Para deshacerlo: borrarlo y `sudo mkinitcpio -P`.
_celiuz_modulos=()
for _celiuz_m in "${MODULES[@]}"; do
    case "$_celiuz_m" in nvidia|nvidia_modeset|nvidia_uvm|nvidia_drm) ;; *) _celiuz_modulos+=("$_celiuz_m") ;; esac
done
MODULES=("${_celiuz_modulos[@]}")
unset _celiuz_modulos _celiuz_m
