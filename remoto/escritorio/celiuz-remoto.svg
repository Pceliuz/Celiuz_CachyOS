<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Icono de Celiuz Remoto: un celular con dos ondas de señal saliendo hacia
       la derecha. Empieza por <svg> y no por un comentario: gdk-pixbuf no
       reconoce un SVG que empiece por comentario (CLAUDE.md, trampas). Los
       colores son los de fabrica de la paleta (abismo, amatista, neon). -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d0418"/>
  <rect x="14" y="12" width="22" height="40" rx="5" fill="none" stroke="#b16cff" stroke-width="3.5"/>
  <line x1="22" y1="46" x2="28" y2="46" stroke="#b16cff" stroke-width="3" stroke-linecap="round"/>
  <path d="M42 26 a8 8 0 0 1 0 12" fill="none" stroke="#c77dff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M47 21 a15 15 0 0 1 0 22" fill="none" stroke="#c77dff" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
</svg>
